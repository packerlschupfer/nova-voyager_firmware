name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        # fetch-depth: 0 because the build stamps `git describe` into the
        # binary (extra_script.py). The default shallow checkout has no tag
        # reachable, so a release would identify itself by bare hash.
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        # Pinned, not --upgrade: an unpinned core resolves whatever is newest
        # that day, which is how the v0.1.0 release binary ended up differing
        # from the locally built, hardware-validated one. Bump deliberately,
        # together with the platform/package pins in platformio.ini.
        run: pip install platformio==6.1.19

      # Must come before check-pins.sh: that check inspects RESOLVED package
      # versions, so on a cold cache it has nothing to inspect and fails.
      # ci.yml gained this step on 2026-10-11 for exactly that reason and
      # release.yml did not — which would have failed the first tag pushed
      # after a 7-day cache eviction, publishing nothing at all.
      - name: Install project packages
        run: pio pkg install -e nova_voyager

      # Fail loudly if the pins are not actually enforced. A pin declared in
      # [common] but not referenced by an env is silently ignored — that is how
      # the first v0.1.0 release ended up built against a different HAL than the
      # hardware-validated binary.
      - name: Verify toolchain pins are enforced
        run: ./scripts/check-pins.sh nova_voyager

      # The tag and the in-tree fallback version must agree before anything is
      # published under that tag's name.
      - name: Verify the version block matches the tag
        run: ./scripts/check-version.sh "${GITHUB_REF_NAME}"

      # A gate nothing calls is not a gate. v0.1.0 shipped with ALIGN
      # energizing the spindle without consulting safety_can_start_motor().
      - name: Verify the motor safety gate is not bypassed
        run: ./scripts/check-safety-gate.sh
      # The native suite compiles no src/, so test_settings' mirrored copy of
      # settings_t IS the coverage. When it drifts the tests keep passing while
      # exercising a layout the firmware does not ship.
      - name: Verify the settings test mirror matches the header
        run: ./scripts/check-settings-mirror.sh
      - name: Verify the settings key lists agree
        run: ./scripts/check-settings-keys.sh
      # 506 native tests gate CI but did not gate releases, so a release could
      # ship code no test run had seen.
      - name: Unit tests
        run: pio test -e native

      - name: Build release firmware
        run: pio run -e nova_voyager -e nova_voyager_games -e nova_voyager_demo

      # Each env writes to .pio/build/<env>/firmware.{bin,elf} — copy out with
      # the env name as prefix so the release assets don't collide.
      - name: Collect release artifacts
        run: |
          mkdir -p release
          # Name assets with the version. They used to be "nova_voyager.bin"
          # with nothing to say which release they came from, and since the
          # v0.1.0 tag was republished ~50 times, identically-named binaries
          # with different contents are already in circulation.
          ver="${GITHUB_REF_NAME}"
          for env in nova_voyager nova_voyager_games nova_voyager_demo; do
            for ext in bin elf; do
              src=".pio/build/$env/firmware.$ext"
              if [ -f "$src" ]; then
                cp "$src" "release/${env}-${ver}.${ext}"
              fi
            done
          done
          (cd release && sha256sum * > sha256sums.txt)
          ls -la release/

      # Not all three builds are equal, and a download page gives no hint of
      # that. Spelled out in the body rather than left to the filename.
      - name: Compose asset notes
        run: |
          cat > release_notes.md <<'NOTE'
          ### Which asset do I want?

          **`nova_voyager`** — the one to use. This is the build that gets
          flashed to the author's machine and the one to run if you intend to
          report anything.

          **`nova_voyager_games`** and **`nova_voyager_demo`** are not for
          diagnosis, and should not be used for it:

          - both carry a **40-sample** jam flight recorder instead of 160, to
            fit the RAM the game task and its FreeRTOS heap take up. A jam
            trace from either is a quarter of the history;
          - `nova_voyager_demo` writes **nothing** to EEPROM or flash, so no
            setting you change survives a power cycle — that is the point of
            it, but it means it cannot reproduce anything settings-dependent;
          - `nova_voyager_demo` also dumps the EEPROM over serial at boot.

          See CHANGELOG.md for what changed, and CONTRIBUTING.md for what to
          include in a report.
          NOTE
          cat release_notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: release_notes.md
          generate_release_notes: true
