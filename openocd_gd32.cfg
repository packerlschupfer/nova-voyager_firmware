# GD32F303 OpenOCD configuration
# GD32 has different CPUTAPID than STM32F103

# Override CPUTAPID before loading target config
set CPUTAPID 0x2ba01477

# Load standard STM32F1 configuration
source [find interface/stlink.cfg]
transport select hla_swd
source [find target/stm32f1x.cfg]

# GD32 may need connect_under_reset or different reset handling
#
# WARNING: `reset_config none` tells OpenOCD there is no NRST line, so every
# reset it and st-flash can issue is SYSRESETREQ (software). SYSRESETREQ does
# NOT reset the Cortex-M debug subsystem, so FPB breakpoint comparators set by
# a debug session survive every "reboot" available here and are only cleared by
# a full reflash. That is the leading explanation for two lockups on 2026-08-29
# where the board sat in Default_Handler across repeated resets.
#
# MEASURED 2026-08-29, and it settles whether wiring NRST is worth it: NO, not
# for the watchdog problem. OFF on the front panel IS NRST (confirmed: pressing
# it produced "*** PIN RESET (NRST) ***", i.e. PINRSTF not SFTRSTF), and after
# that genuine hardware pin reset the firmware still read:
#     DBGMCU_CR at boot: 0x00000307 (IWDG WAS FROZEN)
# So the debug domain survives NRST, exactly as ST documents it (POR only).
# A frozen watchdog is cleared by a POWER CYCLE and by nothing else.
#
# Note the firmware self-heals whenever it runs — it clears DBGMCU_CR at boot.
# The exposure is precisely when the firmware ISN'T running, i.e. stuck in the
# bootloader, which is the lockup case. Neither OFF nor an ST-Link reset helps
# there; pull the power.
#
# What wiring ST-Link pin 15 would still buy: `--connect-under-reset` would
# actually work (flash_firmware.sh:118 already passes it and cannot honour it
# today). That is a narrow benefit — one occurrence all day, recovered anyway —
# against soldering on a working machine. Not recommended.
#
# If NRST is ever wired up anyway, this line must change too — the wire alone
# will not be used while OpenOCD is told the line does not exist. To enable,
# comment out `reset_config none` below and uncomment this instead:
#
#   reset_config srst_only srst_nogate connect_assert_srst
#
# Then confirm the line actually works rather than assuming it:
#   1. st-flash should stop printing
#        "NRST is not connected --> using software reset via AIRCR"
#   2. openocd `reset halt` should land at the reset vector every time:
#        reg pc  -> the bootloader Reset_Handler, not wherever it was running
#   3. the acid test, since clearing debug state is the entire point:
#        mww 0xE0002000 0x00000003   ; arm FPB
#        <reset>
#        mdw 0xE0002000 1            ; must read back 0x...0260 (ENABLE clear)
#      A real reset clears the debug subsystem; SYSRESETREQ does not. If
#      FP_CTRL still reads ENABLE=1 after the reset, the line is not working
#      however it is wired, and you are no better off than before.
#
# Wiring: ST-Link V2 pin 15 (RST) to the target NRST. Whether that signal is
# brought out on this controller board is a hardware question — check before
# changing this file, because a config claiming a reset line that is not
# physically present is worse than `none`: tools will believe resets are
# happening that are not.
#
# Diagnosing a recurrence (read BEFORE reflashing; a reflash destroys evidence):
#   mdw 0xE0002000 10        ; FP_CTRL, FP_REMAP, FP_COMP0..7
#   mdw 0xE000EDF0 1         ; DHCSR
#   mww 0xE0002000 0x00000002 ; KEY=1 ENABLE=0 -> disable FPB, then re-read
#   mww 0xE0002000 0x00000003 ; KEY=1 ENABLE=1 -> restore
#   mdw 0xE000ED28 1         ; CFSR
#   mdw 0xE000ED38 1         ; BFAR - only meaningful if CFSR bit 15 BFARVALID
# Verified 2026-08-29 that those writes land (0x261 -> 0x260 -> 0x261).
#
# FPB is the leading theory but does NOT explain everything; there may be two
# mechanisms. Fault registers from the two incidents:
#   incident 1  CFSR=0x00010400  IMPRECISERR + UNDEFINSTR
#   incident 2  CFSR=0x00000400  IMPRECISERR
#   both        IBUSERR (bit 8) CLEAR, BFARVALID (bit 15) CLEAR
# IMPRECISERR is an imprecise DATA bus error, not a fetch error. IBUSERR being
# clear in both means no instruction fetch ever failed - so something attempted
# a DATA access the bus refused, most naturally a store into flash without
# FLASH_CR PG set. A refused store corrupts nothing, so that is a separate event
# from the changed bytes.
#
# Incident 1 showing UNDEFINSTR WITHOUT IBUSERR says the fetch succeeded and
# returned undecodable data - so what was FETCHED was wrong.
#
# RESOLVED 2026-08-29: the FPB-remap alternative is EXCLUDED, by the attach
# measurement above. OpenOCD clears FP_COMP on attach, so the halted openocd
# dump_image read ran with comparators already zero; a remap could not have been
# live during it, yet that read still returned changed bytes. So the reads were
# not being redirected, and the earlier "the two evidence lines share a common
# cause" objection does not hold - the remap it depended on could not exist.
#
# What that establishes: the wrong bytes were REAL, not a debug artifact.
# What it does NOT establish: the mechanism. And note it does not even separate
# "the cells held wrong data" from "the flash read path returned wrong data" -
# both are real, neither is explained.
#
# DISASSEMBLED 2026-08-29 (verified with objdump on the measured bytes, not by
# eye). The corrupted halfwords decode to exactly the faults that were recorded:
#
#   GOOD                              AS READ
#   8000488: bf00 nop                 b608 <UNDEFINED> instruction: 0xb608
#   800048c: 2233 movs r2,#51         0200 lsls r0,r0,#8
#   8000490: 4b17 ldr r3,[pc,#92]     0000 movs r0,r0      <- load DESTROYED
#   8000492: 601a str r2,[r3,#0]      601a str r2,[r3,#0]  <- store INTACT
#
# The instruction that loads r3 is destroyed; the store through r3 survives. So
# the core stores to whatever junk r3 held - a buffered write to a bad address,
# i.e. IMPRECISERR (seen in BOTH incidents). And 0xb608 at the handler entry is
# UNDEFINSTR (seen in incident 1). One trace, both bits, no extra assumptions.
#
# This weighs strongly toward the cells being wrong rather than the read path
# being faulty: a broken read path has no reason to return garbage that
# disassembles into precisely the fault signature that was recorded.
#
# The region spans Default_Handler into clock_init's prologue, which every boot
# executes - so it also explains persistence across resets on its own,
# independently of the frozen IWDG.
#
# COMPETING READING (better supported, not settled): the entry halfword was
# MISREAD rather than damaged - the cells held bf00 all along.
#
# For it: the program-shape test over BOTH incidents finds exactly ONE
# non-program-shaped byte each, and it is always the first byte of the entry
# halfword, always the identical 0x00 -> 0x08:
#     incident 1: 0x047C src=0x00 read=0x08   (all 7 others program-shaped)
#     incident 2: 0x0488 src=0x00 read=0x08   (all 7 others program-shaped)
# And with the halfword intact, `bf00 nop; e7fd b.n self` is a RUNNING two-
# instruction self-loop - which explains pc pinned at the entry with S_LOCKUP
# legitimately clear, stable across sessions. Under the damaged reading the core
# would execute b608, escalate, and report pc=0xFFFFFFFE; we read the entry.
#
# Against it: incident 1's CFSR was 0x00010400 - UNDEFINSTR IS SET, and under
# this reading incident 1's whole span decodes to valid instructions
# (nop / b.n / lsls / push / movs / str / strb / strh), so nothing there could
# have set that bit. That objection stands and is unexplained.
#
# BUT THE TWO OBJECTIONS ARE NOT SYMMETRIC, which is what decides it. CFSR bits
# are sticky until cleared by software or reset, so stickiness can leave a bit
# SET that this fault did not set - it can never clear a bit this fault DID set.
# False positives only, never false negatives. Therefore:
#   misread reading must explain a PRESENT bit (incident 1) -> stickiness covers
#     it: set earlier that boot, never cleared. Costs an extra unobserved event.
#   damaged reading must explain an ABSENT bit (incident 2) -> nothing covers it.
#     The core sat with pc pinned at that halfword across four sessions minutes
#     apart; it cannot have failed to execute it; executing 0xb608 sets
#     UNDEFINSTR; and the bootloader never writes CFSR (verified: its only SCB
#     write is SCB->AIRCR), so the bit would still be there. It was not.
# So incident 2 is a direct contradiction of the damaged reading and is not
# rescuable, while incident 1 is an unexplained gap in the misread reading that
# is. Misread is the better-supported reading; incident 1 stays a live objection.
#
# Also on record, though it discriminates neither way: the corrupted VALUES are
# near-identical across two incidents and two builds - b608/0200/0000 in both,
# differing only in the fourth halfword (7500 vs 8100). Every program-shaped
# halfword is a strict bit-subset of its source in both incidents, i.e.
# AND-consistent. (Both incidents' second halfword had source 0x2233, not
# 0x2232/0x2233 as first thought - identical source, identical read.)
#
# HOW MUCH TO TRUST ANY OF THIS: the reading above rests on inference across two
# incidents that cannot be reproduced on demand, and it went through three
# reversals in one day - "readback artifact", then "definitely real corruption",
# then "real except one misread halfword". Each reversal came from a measurement,
# not a rethink, which is the good case; but it is a best-supported reading, not
# a diagnosis. THE TWO RECURRENCE CHECKS BELOW MATTER MORE THAN THE CONCLUSION.
# If it happens again, measure first and re-derive - do not start from here.
#
# ON RECURRENCE, additionally: read CFSR, write it back to clear it, resume
# briefly, read again - that separates a live fault from a stale sticky bit.
# Also capture DHCSR explicitly and note whether any stepping preceded the pc
# read. And read the damaged span twice, once halted at that pc and once with pc
# moved elsewhere: if only the entry halfword changes between the two reads,
# that is the misread mechanism.
#
# STILL mechanically unexplained either way: byte 0x0488 read 0x08 where the
# image holds 0x00. Programming only clears bits, and an erase would have
# blanked the whole 2 KB page rather than eight bytes. Under the cells reading
# that bit really did go 0->1 in flash. Real, coherent in its effects, and
# without a mechanism.
#
# MEASURED 2026-08-29 — OpenOCD clears FPB comparators both on attach and on
# reset (armed FP_COMP0=0x4803F001; after detach/re-attach 0x00000000; after
# `reset halt` in the same session 0x00000000). Consequences:
#   - the all-zero FP_COMP readings taken during both lockups proved nothing;
#     attaching to read them destroys them first
#   - no debugger-based method can observe inherited FPB state on this rig
#   - and since both lockups survived OpenOCD resets, which clear comparators,
#     stale FPB is a poor explanation for the persistence. The frozen IWDG
#     (DBGMCU_CR, above) explains that part; the changed bytes remain open.
#
# *** ON A RECURRENCE, DO NOT REFLASH FIRST. *** Reflashing destroys the only
# measurement that separates the two: disable FP_CTRL and re-read the bytes
# BEFORE touching flash. If they correct themselves it was the tooling; if they
# stay wrong the flash really was damaged. That test only exists while nobody
# believes the question is already settled.
reset_config none
