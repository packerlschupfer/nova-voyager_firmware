; Nova Voyager Custom Firmware
; PlatformIO Project Configuration
;
; Target: GD32F303RCT6 (256KB Flash, 48KB usable SRAM, Cortex-M4, 72MHz)
; Note: GD32 is largely STM32-compatible, uses STM32F1xx HAL
; Original bootloader at 0x08000000-0x08002FFF (12KB)
; Application starts at 0x08003000 (244KB available)
;
; Build environments:
;   pio run -e release      # Production build (default)
;   pio run -e debug        # Debug build with extra features
;   pio test -e native      # Run unit tests on host

;===========================================================================
; Common settings for all target builds
;===========================================================================
[common]
; Everything below is version-pinned so a CI build reproduces a local one.
;
; Before pinning, CI ran `pip install --upgrade platformio` against an
; unpinned `platform = ststm32`, so it resolved whatever was newest that day.
; The first v0.1.0 release binary came out 4 bytes larger than the locally
; built, hardware-validated one for exactly that reason: CI resolved
; framework-stm32cubef1 1.8.7 while local had 1.8.6. The compiler matched all
; along — "toolchain drift" does not necessarily mean the compiler.
; For firmware that decides whether a spindle turns, the artifact people
; download should be the artifact that was tested.
;
; Pinning the platform alone is not enough: its manifest requests package
; RANGES (toolchain >=1.60301.0,<1.80000.0), which still drift. Hence the
; explicit platform_packages below. The CI workflows pin the PlatformIO core
; version to match — all three have to be fixed or none of it holds.
;
; CRITICAL: platform_packages here is INERT unless each env references it with
; `platform_packages = ${common.platform_packages}`. Declaring it in [common]
; alone silently does nothing. scripts/check-pins.sh asserts the pins are
; actually enforced and runs in CI; run it after touching any of this.
platform = ststm32@19.4.0
platform_packages =
    platformio/toolchain-gccarmnoneeabi@1.70201.0
    platformio/framework-stm32cubef1@1.8.7
    platformio/tool-ldscripts-ststm32@0.2.0
board = genericSTM32F103RC
framework = stm32cube
board_build.ldscript = ldscript.ld
board_build.mcu = stm32f103rct6

lib_deps =
    bojit/PlatformIO-FreeRTOS@2.1.4

; Common build flags for GD32F303
build_flags_base =
    -D STM32F103xG
    -D USE_HAL_DRIVER
    -D HSE_VALUE=8000000
    -D GD32F303
    -I include
    -ffunction-sections
    -fdata-sections
    -fstack-usage
    ; REVIEW FIX: -Wno-unused-variable/-Wno-unused-function used to live here,
    ; and base flags come before the per-env -Wall -Wextra, so they won.
    ; A dead duplicate of the serial command parser sat in commands.c for
    ; months without a peep. If something here is deliberately unused, mark it
    ; __attribute__((unused)) at the declaration where a reader can see why.

build_src_filter = +<*> -<lcd_spi_graphics.c> -<pong.c> -<snake.c> -<penguin.c> -<beerquill.c> -<showcase.c>
build_src_filter_games = +<*> -<lcd_spi_graphics.c> -<showcase.c>

extra_scripts =
    pre:extra_script.py
    post:post_build.py

monitor_port = /dev/ttyNova
monitor_speed = 9600

;===========================================================================
; Global options applied to every environment.
; -Wall/-Wextra via build_src_flags → our src/ only, not framework or libs.
;===========================================================================
[env]
build_src_flags = -Wall -Wextra

;===========================================================================
; Release Build (Production)
;===========================================================================
[env:release]
platform = ${common.platform}
platform_packages = ${common.platform_packages}
board = ${common.board}
framework = ${common.framework}
board_build.ldscript = ${common.board_build.ldscript}
board_build.mcu = ${common.board_build.mcu}
lib_deps = ${common.lib_deps}
build_src_filter = ${common.build_src_filter}
extra_scripts = ${common.extra_scripts}
monitor_port = ${common.monitor_port}
monitor_speed = ${common.monitor_speed}

build_flags =
    ${common.build_flags_base}
    -Os                         ; Optimize for size
    -D NDEBUG                   ; Disable assertions
    -D BUILD_RELEASE=1
    -D LOG_LEVEL=1              ; Minimal logging (errors only)

upload_protocol = custom
upload_command = openocd -f openocd_gd32.cfg -c "init; halt; program {$SOURCE} 0x08003000 verify; reset run; shutdown"

;===========================================================================
; Debug Build (Development)
;===========================================================================
[env:debug]
platform = ${common.platform}
platform_packages = ${common.platform_packages}
board = ${common.board}
framework = ${common.framework}
board_build.ldscript = ${common.board_build.ldscript}
board_build.mcu = ${common.board_build.mcu}
lib_deps = ${common.lib_deps}
build_src_filter = ${common.build_src_filter}
extra_scripts = ${common.extra_scripts}
monitor_port = ${common.monitor_port}
monitor_speed = ${common.monitor_speed}

build_flags =
    ${common.build_flags_base}
    -Og                         ; Optimize for debugging
    -g3                         ; Maximum debug info
    -D DEBUG=1
    -D BUILD_DEBUG=1
    -D LOG_LEVEL=3              ; Verbose logging (debug, info, warn, error)
    -D STACK_EXTRA=64           ; Extra stack per task for safety
    -D ENABLE_RUNTIME_STATS=1   ; FreeRTOS runtime statistics
    -D ENABLE_STACK_WATERMARK=1 ; Stack high water mark reporting

upload_protocol = custom
upload_command = openocd -f openocd_gd32.cfg -c "init; halt; program {$SOURCE} 0x08003000 verify; reset run; shutdown"

debug_tool = stlink
debug_init_break = tbreak main

;===========================================================================
; 120MHz Release Build (GD32 performance mode, USB DFU disabled)
;===========================================================================
[env:release_120]
platform = ${common.platform}
platform_packages = ${common.platform_packages}
board = ${common.board}
framework = ${common.framework}
board_build.ldscript = ${common.board_build.ldscript}
board_build.mcu = ${common.board_build.mcu}
lib_deps = ${common.lib_deps}
build_src_filter = ${common.build_src_filter}
extra_scripts = ${common.extra_scripts}
monitor_port = ${common.monitor_port}
monitor_speed = ${common.monitor_speed}

build_flags =
    ${common.build_flags_base}
    -Os
    -D NDEBUG
    -D BUILD_RELEASE=1
    -D USE_120MHZ=1             ; Enable 120MHz mode
    -D LOG_LEVEL=1

upload_protocol = custom
upload_command = openocd -f openocd_gd32.cfg -c "init; halt; program {$SOURCE} 0x08003000 verify; reset run; shutdown"

;===========================================================================
; 120MHz Debug Build (GD32 performance mode, full debugging)
;===========================================================================
[env:debug_120]
platform = ${common.platform}
platform_packages = ${common.platform_packages}
board = ${common.board}
framework = ${common.framework}
board_build.ldscript = ${common.board_build.ldscript}
board_build.mcu = ${common.board_build.mcu}
lib_deps = ${common.lib_deps}
build_src_filter = ${common.build_src_filter}
extra_scripts = ${common.extra_scripts}
monitor_port = ${common.monitor_port}
monitor_speed = ${common.monitor_speed}

build_flags =
    ${common.build_flags_base}
    -Og
    -g3
    -D DEBUG=1
    -D BUILD_DEBUG=1
    -D USE_120MHZ=1             ; Enable 120MHz mode
    -D LOG_LEVEL=3
    -D STACK_EXTRA=64
    -D ENABLE_RUNTIME_STATS=1
    -D ENABLE_STACK_WATERMARK=1

upload_protocol = custom
upload_command = openocd -f openocd_gd32.cfg -c "init; halt; program {$SOURCE} 0x08003000 verify; reset run; shutdown"

debug_tool = stlink
debug_init_break = tbreak main

;===========================================================================
; Default environment (alias for release @ 120MHz for GD32F303)
;===========================================================================
[env:nova_voyager]
extends = env:release_120


;===========================================================================
; Default + Games (includes Pong, Snake, Penguin)
;===========================================================================
[env:nova_voyager_games]
extends = env:release_120
build_src_filter = ${common.build_src_filter_games}
build_flags =
    ${common.build_flags_base}
    -Os
    -D NDEBUG
    -D BUILD_RELEASE=1
    -D USE_120MHZ=1
    -D LOG_LEVEL=1
    -D BUILD_GAMES=1

;===========================================================================
; Read-Only Demo (for potential users): writes nothing to EEPROM/flash,
; dumps EEPROM over serial at boot, adds MCB diagnostics + graphics showcase.
; BUILD_GAMES is also enabled so the showcase reuses the game-launch task path.
;===========================================================================
[env:nova_voyager_demo]
extends = env:release_120
build_src_filter = ${common.build_src_filter_games} +<showcase.c>
build_flags =
    ${common.build_flags_base}
    -Os
    -D NDEBUG
    -D BUILD_RELEASE=1
    -D USE_120MHZ=1
    -D LOG_LEVEL=1
    -D BUILD_GAMES=1
    -D BUILD_READONLY=1

;===========================================================================
; Native Unit Tests (runs on host PC)
;===========================================================================
[env:native]
platform = native
build_flags =
    -I test/mocks
    -I include
    -D NATIVE_TEST=1
    -std=c11
    -g

test_framework = unity
test_build_src = true
build_src_filter = -<*>  ; Don't build src/ for native tests

;===========================================================================
; On-Target Tests (runs on device)
;===========================================================================
[env:target_test]
platform = ${common.platform}
platform_packages = ${common.platform_packages}
board = ${common.board}
framework = ${common.framework}
board_build.ldscript = ${common.board_build.ldscript}
board_build.mcu = ${common.board_build.mcu}
lib_deps = ${common.lib_deps}
extra_scripts = ${common.extra_scripts}

build_flags =
    ${common.build_flags_base}
    -Og
    -g3
    -D DEBUG=1
    -D BUILD_TEST=1
    -D ENABLE_TARGET_TESTS=1

build_src_filter = +<*>

upload_protocol = custom
upload_command = openocd -f openocd_gd32.cfg -c "init; halt; program {$SOURCE} 0x08003000 verify; reset run; shutdown"

;===========================================================================
; REVIEW FIX: [env:minimal] removed. It was a bring-up scaffold with
; build_src_filter = +<main.c> and no FreeRTOS include path, so it stopped
; compiling the moment main.c grew its first FreeRTOS include — `pio run -e
; minimal` has been a hard error for a long time. CI never built it, which is
; why nobody noticed. The two source files it grew up with, main_minimal.c and
; main_test.c, are gone from src/ as well.
;===========================================================================

;===========================================================================
; HSE-failure test build (NOT for production)
;===========================================================================
; Forces clock_init()'s crystal-dead path so the fault response can be
; exercised on real hardware without a dead crystal: the bounded wait times
; out for real, g_clock_fault is set for real, safety_can_start_motor()
; refuses for real, the LCD fault screen renders, and the console comes up on
; the HSI divisor. A board running this build will ALWAYS refuse to start the
; motor — reflash a normal env afterwards.
;
; PRECISION ABOUT WHAT THIS PROVES. It clears HSEON and waits for HSERDY to
; actually fall, so the real bounded wait really does poll HSERDY and really
; does time out — the detection code is exercised, not bypassed. What it does
; NOT prove is that a physically dead crystal drives HSERDY the same way. That
; it would is documented behaviour for a stopped oscillator, but it is an
; assumption here, not a measurement. So: "the fault response is verified on
; hardware, with HSERDY forced low by disabling HSE" is the claim that is
; supported. "Verified against a dead crystal" is not, and no build flag can
; make it so.
[env:hse_fail_test]
extends = env:debug
build_flags =
    ${common.build_flags_base}
    -Og
    -g3
    -D DEBUG=1
    -D BUILD_DEBUG=1
    -D LOG_LEVEL=3
    -D STACK_EXTRA=64
    -D HSE_FAIL_TEST=1
